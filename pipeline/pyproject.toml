[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hyperpod"
version = "0.1.0"
description = "HyperPod Hyperliquid main-perp analytics pipeline"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.12,<1.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7.0",
  "jsonschema>=4.22,<5.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "respx>=0.21,<1.0",
  "ruff>=0.5,<1.0",
  "types-PyYAML>=6.0,<7.0",
  "types-jsonschema>=4.22,<5.0",
]

[project.scripts]
hyperpod = "hyperpod.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperpod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: live network tests hitting external endpoints (excluded from default CI)",
]
