name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  schemas:
    name: JSON Schemas & Site Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: python -m pip install --no-cache-dir "check-jsonschema>=0.37,<1.0"

      - name: Validate schemas, examples, and fixtures/site-data
        run: bash scripts/validate_schemas.sh

  python:
    name: Python Pipeline (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict typecheck
        run: uv run mypy --strict src tests

      - name: Pytest (offline suite)
        run: uv run pytest

      - name: CLI contract validation smoke check
        run: uv run hyperpod validate-contracts

  flutter:
    name: Flutter Web App (analyze, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (pinned in .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web release
        run: flutter build web --release --base-href /hyperpod-analytics/

      - name: Run Dart domain benchmark (if present)
        run: |
          if [ -f benchmark/domain_benchmark.dart ]; then
            dart run benchmark/domain_benchmark.dart
          fi
