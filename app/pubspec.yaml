name: hyperpod_app
description: "HyperPod Hyperliquid main-perp smart-money analytics web application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: "3.41.9"

dependencies:
  collection: ^1.19.0
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  http: ^1.3.0
  intl: ^0.20.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: test/fonts/Roboto-Regular.ttf
        - asset: test/fonts/Roboto-Medium.ttf
          weight: 500
